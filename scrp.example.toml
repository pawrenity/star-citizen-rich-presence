# Copy to scrp.toml beside the executable. All settings are optional.
# The application only reads Game.log. It never changes user.cfg or captures the screen.

channel = "LIVE" # LIVE, PTU, EPTU, TECH-PREVIEW
discord_app_id = "983874700440645672"
poll_seconds = 2
update_seconds = 15
location_ttl_seconds = 900 # expire the last reported location after 15 minutes
show_profile = true
show_contracts = true
show_notifications = true # short-lived blueprint, refinery, and hangar notices
show_ship = true
show_party = true # adds "In a party" while you are in a party
show_artwork = true # wiki artwork for locations, ships, and mission types
check_for_updates = true # the control panel asks GitHub for new releases (no personal data)

# The verb in front of the game name: playing, listening, watching, or competing.
# The game name itself is your Discord application's name: to show "Listening to
# Scam Citizen", create an app with that name at https://discord.com/developers,
# put its ID in discord_app_id, and set activity_type = "listening".
activity_type = "playing"
# What the member list shows after the verb: name (the app name), details, or state.
status_display = "name"

# Override automatic discovery for a custom installation.
# Windows paths use single quotes in TOML so backslashes stay literal.
# log_path = 'D:\Games\StarCitizen\LIVE\Game.log'

# Add/override location aliases without rebuilding. See data/locations.json for the schema.
# locations_file = 'my-locations.json'

# Optional public Discord links. With one custom button, the RSI profile can
# use the second slot. With two custom buttons, both slots go to your links.
# [[buttons]]
# label = "Twitch"
# url = "https://www.twitch.tv/example"
#
# [[buttons]]
# label = "Our org"
# url = "https://robertsspaceindustries.com/orgs/EXAMPLE"

# Image values below can be a public HTTPS image URL or an asset key from your own
# Discord application. Discord cannot show local files.
# Location artwork, keyed by location name.
[image_assets]
# "Area18" = "area18"
# "Hurston" = "hurston"
# "Levski" = "levski"

# Ship artwork. Open artwork-gallery.html to browse every wiki image and click
# one to copy its line. A number picks that wiki choice (1 is the default).
[ship_images]
# "Aegis Gladius" = "3"
# "RSI Perseus" = "https://example.com/my-perseus.png"

# Mission icons, keyed by type (bounty, mercenary, hauling, delivery, mining, salvage,
# rescue, investigation, racing, xenothreat, wikelo, arena) or by any words from a
# contract title. The longest matching title words win over the type.
[mission_images]
# bounty = "1"
# "Tactical Strike" = "https://example.com/strike.png"

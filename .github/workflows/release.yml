name: Windows release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Package portable application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package
          Copy-Item target/release/star-citizen-rich-presence.exe,scrp.example.toml,README.md,VALIDATION.md,RELEASE_NOTES.md,LICENSE,data/content-source.json,assets/artwork-gallery.html package/
          Compress-Archive -Path package/* -DestinationPath star-citizen-rich-presence-windows-x64.zip
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$version" "/DOutputDir=$PWD" installer/scrp.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Checksums
        shell: pwsh
        run: |
          'star-citizen-rich-presence-windows-x64.zip', 'star-citizen-rich-presence-setup-x64.exe' | ForEach-Object {
            (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower() + "  $_"
          } | Set-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: portable-windows-x64
          path: |
            star-citizen-rich-presence-windows-x64.zip
            star-citizen-rich-presence-setup-x64.exe
            SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Star Citizen Rich Presence ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            star-citizen-rich-presence-windows-x64.zip
            star-citizen-rich-presence-setup-x64.exe
            SHA256SUMS.txt
